<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8c6a24" />
    <title>AFROGLOW</title>
    <meta
      name="description"
      content="AFROGLOW: tranças afro feitas com cuidado, técnica e identidade. Agenda a tua sessão em Portugal."
    />
    <link rel="canonical" href="https://afroglow.pt/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AFROGLOW" />
    <meta property="og:url" content="https://afroglow.pt/" />
    <meta property="og:title" content="AFROGLOW | Tranças Afro em Portugal" />
    <meta
      property="og:description"
      content="Tranças afro feitas com cuidado, técnica e identidade. Agenda a tua sessão em Portugal."
    />
    <meta property="og:image" content="https://afroglow.pt/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_PT" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AFROGLOW | Tranças Afro em Portugal" />
    <meta
      name="twitter:description"
      content="Tranças afro feitas com cuidado, técnica e identidade. Agenda a tua sessão em Portugal."
    />
    <meta name="twitter:image" content="https://afroglow.pt/images/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "AFROGLOW",
        "url": "https://afroglow.pt/",
        "image": "https://afroglow.pt/images/og-image.jpg",
        "description": "Tranças afro feitas com cuidado, técnica e identidade em Portugal.",
        "areaServed": "PT",
        "sameAs": ["https://www.instagram.com/afroogloww"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (text shows in a fallback font, then swaps). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&family=Poppins:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&family=Poppins:wght@300;400;500;600&display=swap"
      />
    </noscript>
    <!-- Brand font used by the hero title: fetched at once so the title paints in it right away. -->
    <link rel="preload" href="/fonts/lamoric-rowen.ttf" as="font" type="font/ttf" crossorigin />
    <!-- Icon font served from our own domain; loaded without blocking the first paint. -->
    <link rel="stylesheet" href="/vendor/boxicons/css/boxicons.min.css" media="print" onload="this.media = 'all'" />
    <noscript><link rel="stylesheet" href="/vendor/boxicons/css/boxicons.min.css" /></noscript>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('afroglow-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Painted before any JavaScript runs, replaced by the app as soon as it loads. -->
      <div
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#2b1d12;color:#c9a84c;font:400 14px/1 'DM Sans',system-ui,sans-serif;letter-spacing:.4em"
      >
        AFROGLOW
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
