<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8c6a24" />
    <title>AFROGLOW</title>
    <meta
      name="description"
      content="AFROGLOW: tranças afro feitas com cuidado, técnica e identidade. Agenda a tua sessão em Portugal."
    />
    <link rel="canonical" href="https://afroglow.pt/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AFROGLOW" />
    <meta property="og:url" content="https://afroglow.pt/" />
    <meta property="og:title" content="AFROGLOW | Tranças Afro em Portugal" />
    <meta
      property="og:description"
      content="Tranças afro feitas com cuidado, técnica e identidade. Agenda a tua sessão em Portugal."
    />
    <meta property="og:image" content="https://afroglow.pt/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_PT" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AFROGLOW | Tranças Afro em Portugal" />
    <meta
      name="twitter:description"
      content="Tranças afro feitas com cuidado, técnica e identidade. Agenda a tua sessão em Portugal."
    />
    <meta name="twitter:image" content="https://afroglow.pt/images/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "AFROGLOW",
        "url": "https://afroglow.pt/",
        "image": "https://afroglow.pt/images/og-image.jpg",
        "description": "Tranças afro feitas com cuidado, técnica e identidade em Portugal.",
        "areaServed": "PT",
        "sameAs": ["https://www.instagram.com/afroogloww"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (text shows in a fallback font, then swaps). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&family=Poppins:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&family=Poppins:wght@300;400;500;600&display=swap"
      />
    </noscript>
    <!-- Brand font used by the hero title: fetched at once so the title paints in it right away. -->
    <link rel="preload" href="/fonts/lamoric-rowen.ttf" as="font" type="font/ttf" crossorigin />
    <!-- Icon font served from our own domain; loaded without blocking the first paint. -->
    <link rel="stylesheet" href="/vendor/boxicons/css/boxicons.min.css" media="print" onload="this.media = 'all'" />
    <noscript><link rel="stylesheet" href="/vendor/boxicons/css/boxicons.min.css" /></noscript>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('afroglow-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          // The hero photo is the largest thing on screen: start fetching the right one at once.
          var poster = document.createElement('link')
          poster.rel = 'preload'
          poster.as = 'image'
          poster.href = '/images/hero-poster-' + theme + '.jpg'
          document.head.appendChild(poster)
        } catch (e) {}
      })()
    </script>
    <style>
      #boot{position:relative;display:flex;min-height:100vh;align-items:center;justify-content:center;overflow:hidden;background:#1a1008 url(/images/hero-poster-light.jpg) center/cover no-repeat}
      html.dark #boot{background-image:url(/images/hero-poster-dark.jpg)}
      #boot::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(59,31,14,.55),rgba(59,31,14,.4),rgba(26,16,8,.7))}
      html.dark #boot::before{background:linear-gradient(to bottom,rgba(26,16,8,.7),rgba(26,16,8,.55),rgba(26,16,8,.85))}
      .boot-copy{position:relative;display:flex;max-width:48rem;flex-direction:column;align-items:center;padding:0 24px;text-align:center;color:#f5efdf}
      .boot-kicker{margin-bottom:16px;font:400 12px/1 'DM Sans',system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#c9a84c}
      .boot-title{margin:0;font:400 8.4vw/1.05 'Lamoric Rowen',cursive;text-shadow:0 2px 24px rgba(0,0,0,.45)}
      .boot-sub{margin:24px 0 0;max-width:28rem;font:300 16px/1.5 'Poppins',system-ui,sans-serif;text-shadow:0 1px 14px rgba(0,0,0,.5)}
      .boot-gap{height:88px}
      @media(min-width:640px){.boot-title{font-size:7vw}.boot-sub{font-size:18px}}
      @media(min-width:768px){.boot-title{font-size:6vw}}
      html[data-boot="off"] #boot{display:none}
    </style>
    <script>
      (function () {
        var c = window.Capacitor
        var native = c && c.isNativePlatform && c.isNativePlatform()
        if (location.pathname !== '/' || native) document.documentElement.setAttribute('data-boot', 'off')
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- The first screen, painted from plain HTML/CSS before any JavaScript runs. React replaces it. -->
      <div id="boot">
        <div class="boot-copy">
          <span class="boot-kicker">AFROGLOW · Portugal</span>
          <h1 class="boot-title">Cada penteado,<br />uma obra de arte.</h1>
          <p class="boot-sub">Tranças afro feitas com cuidado, técnica e identidade.</p>
          <div class="boot-gap"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
